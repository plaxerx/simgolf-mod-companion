# Companion labels (personal QOL, not upstream): clearer building and skill
# names. Installed and switched on by Apply-CompanionPatches.ps1 -Labels on
# (mods.ini [mods] companion_labels=1); -Labels off removes it.
id = "companion_labels"
name = "Companion labels"
version = "0.1.0"
authors = ["companion"]
description = "Clearer names: Snack Shack for the Snack Bar, Cart Barn, Practice Green, Broadcast Booth, and golf terms for the skills (Driving Distance, Iron Play, Scrambling). Only names change, so it works with any save."
platform = "^1.0"
game = ">=1.2.0"
tags = ["labels"]

[touches.data]
"buildings.home_site.name" = "set"
"buildings.putting_green.name" = "set"
